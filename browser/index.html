<title>DMML Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  /* ============ tokens ============ */
  :root {
    --bg: #14120f;
    --surface: #1c1815;
    --surface-2: #241f1a;
    --surface-3: #2c2620;
    --border: #362f26;
    --border-soft: #2a2420;
    --text: #ede3d0;
    --text-dim: #a89c87;
    --text-faint: #766b5b;
    --accent: #d08a44;
    --accent-strong: #e6a55e;
    --accent-ink: #2a1a08;
    --cite: #5fa8a3;
    --cite-strong: #7fc4bf;
    --external: #b25c4a;
    --focus: #e6a55e;
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.55);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4ede0;
      --surface: #ffffff;
      --surface-2: #f7f1e6;
      --surface-3: #efe6d5;
      --border: #ddd0b8;
      --border-soft: #e6dcc7;
      --text: #2c2318;
      --text-dim: #6b5f4c;
      --text-faint: #948870;
      --accent: #b06a2a;
      --accent-strong: #8f5420;
      --accent-ink: #fff3e2;
      --cite: #2f7d78;
      --cite-strong: #1f5f5b;
      --external: #a44530;
      --focus: #8f5420;
      --shadow: 0 10px 24px -14px rgba(60, 45, 20, 0.35);
    }
  }
  :root[data-theme="light"] {
    --bg: #f4ede0;
    --surface: #ffffff;
    --surface-2: #f7f1e6;
    --surface-3: #efe6d5;
    --border: #ddd0b8;
    --border-soft: #e6dcc7;
    --text: #2c2318;
    --text-dim: #6b5f4c;
    --text-faint: #948870;
    --accent: #b06a2a;
    --accent-strong: #8f5420;
    --accent-ink: #fff3e2;
    --cite: #2f7d78;
    --cite-strong: #1f5f5b;
    --external: #a44530;
    --focus: #8f5420;
    --shadow: 0 10px 24px -14px rgba(60, 45, 20, 0.35);
  }
  :root[data-theme="dark"] {
    --bg: #14120f;
    --surface: #1c1815;
    --surface-2: #241f1a;
    --surface-3: #2c2620;
    --border: #362f26;
    --border-soft: #2a2420;
    --text: #ede3d0;
    --text-dim: #a89c87;
    --text-faint: #766b5b;
    --accent: #d08a44;
    --accent-strong: #e6a55e;
    --accent-ink: #2a1a08;
    --cite: #5fa8a3;
    --cite-strong: #7fc4bf;
    --external: #b25c4a;
    --focus: #e6a55e;
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  a { color: inherit; }

  .app { display: flex; flex-direction: column; height: 100vh; min-height: 640px; }

  /* ============ header ============ */
  header.top {
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
    padding: 0.9rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
    row-gap: 0.5rem;
  }
  .wordmark {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-optical-sizing: auto;
    font-size: 1.35rem;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .wordmark .rock { color: var(--accent); }
  .tagline {
    font-size: 0.8rem;
    color: var(--text-faint);
    font-style: italic;
    font-family: "Fraunces", Georgia, serif;
  }
  .tabs {
    display: flex;
    gap: 0.35rem;
    margin-left: auto;
  }
  .tab {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    font: inherit;
    font-size: 0.82rem;
    padding: 0.42rem 0.85rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: var(--text); border-color: var(--text-faint); }
  .tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .tab[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 500;
  }

  /* ============ stats strip ============ */
  .stats {
    display: flex;
    gap: 1.75rem;
    padding: 0.55rem 1.5rem;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border-soft);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.76rem;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .stats b { color: var(--accent-strong); font-weight: 500; }
  .stats .desc {
    font-family: "IBM Plex Sans", sans-serif;
    font-style: italic;
    color: var(--text-faint);
    margin-left: auto;
  }

  /* ============ main split ============ */
  main.split {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr min(360px, 34vw);
    min-height: 0;
  }
  @media (max-width: 760px) {
    main.split { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  }

  .canvas-wrap {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 15% 8%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 45%),
      var(--bg);
    cursor: grab;
  }
  .canvas-wrap.grabbing { cursor: grabbing; }
  .canvas-wrap svg { display: block; width: 100%; height: 100%; touch-action: none; }

  .zoom-controls {
    position: absolute;
    right: 0.9rem;
    bottom: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    z-index: 5;
  }
  .zoom-btn {
    width: 2rem; height: 2rem;
    display: grid; place-items: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: 1rem/1 "IBM Plex Mono", monospace;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .zoom-btn:hover { background: var(--surface-3); }
  .zoom-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .legend {
    position: absolute;
    left: 0.9rem;
    bottom: 0.9rem;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 0.8rem;
    font-size: 0.72rem;
    color: var(--text-dim);
    box-shadow: var(--shadow);
    max-width: 220px;
    backdrop-filter: blur(3px);
  }
  .legend h3 {
    margin: 0 0 0.4rem;
    font: 500 0.68rem "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
  }
  .legend .row { display: flex; align-items: center; gap: 0.45rem; margin: 0.2rem 0; }
  .legend .swatch { width: 0.65rem; height: 0.65rem; border-radius: 3px; flex: none; }
  .legend .line { width: 1.1rem; height: 2px; flex: none; }

  /* node/edge SVG styling */
  .node-card { cursor: pointer; }
  .node-card rect {
    stroke: var(--border);
    stroke-width: 1;
    transition: stroke 0.12s, stroke-width 0.12s, filter 0.12s;
  }
  .node-card text {
    font-family: "IBM Plex Mono", monospace;
    fill: var(--text);
    pointer-events: none;
  }
  .node-card .verb {
    fill: var(--text-faint);
    font-style: italic;
    font-family: "IBM Plex Sans", sans-serif;
  }
  .node-card:hover rect { stroke: var(--text-dim); }
  .node-card.selected rect { stroke: var(--focus); stroke-width: 2; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--focus) 55%, transparent)); }
  .node-card.dimmed { opacity: 0.28; }
  .node-card.related rect { stroke: var(--accent-strong); }

  .edge-path {
    fill: none;
    stroke: var(--border);
    stroke-width: 1.3;
    transition: stroke 0.12s, stroke-width 0.12s, opacity 0.12s;
  }
  .edge-path.dimmed { opacity: 0.12; }
  .edge-path.outgoing { stroke: var(--cite-strong); stroke-width: 2; }
  .edge-path.incoming { stroke: var(--accent-strong); stroke-width: 2; }
  .edge-stub { stroke: var(--external); stroke-width: 1.3; stroke-dasharray: 3 3; fill: none; }
  .edge-stub-label { font-family: "IBM Plex Mono", monospace; font-size: 8.5px; fill: var(--external); }

  .gen-band { fill: color-mix(in srgb, var(--surface-2) 60%, transparent); }
  .gen-band:nth-child(even) { fill: color-mix(in srgb, var(--surface-2) 30%, transparent); }
  .gen-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    fill: var(--text-faint);
  }

  /* ============ inspector ============ */
  aside.inspector {
    border-left: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 1.1rem 1.2rem 2rem;
  }
  @media (max-width: 760px) {
    aside.inspector { border-left: none; border-top: 1px solid var(--border); max-height: 42vh; }
  }
  .inspector .empty {
    color: var(--text-faint);
    font-style: italic;
    font-family: "Fraunces", Georgia, serif;
    font-size: 0.95rem;
    line-height: 1.6;
    padding-top: 1.5rem;
  }
  .insp-eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-faint);
    margin-bottom: 0.3rem;
  }
  .insp-subject {
    font-family: "Fraunces", Georgia, serif;
    font-size: 1.25rem;
    font-weight: 600;
    text-wrap: balance;
    margin: 0 0 0.15rem;
  }
  .insp-meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.7rem;
    margin-bottom: 0.9rem;
  }
  .insp-meta .gen-chip {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 0.08rem 0.5rem;
    border-radius: 999px;
    font-weight: 500;
  }
  .insp-value {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 0.8rem 0.9rem;
    font-size: 0.92rem;
    line-height: 1.55;
    margin-bottom: 1.1rem;
  }
  .insp-value .pred { color: var(--accent-strong); font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; display: block; margin-bottom: 0.3rem; }
  .insp-section h4 {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin: 1.1rem 0 0.4rem;
  }
  .insp-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.35rem; }
  .insp-list li {
    border: 1px solid var(--border-soft);
    background: var(--surface-2);
    border-radius: 8px;
    padding: 0.45rem 0.6rem;
  }
  .insp-list button {
    all: unset;
    cursor: pointer;
    display: block;
    width: 100%;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.76rem;
    color: var(--cite-strong);
  }
  .insp-list button:hover { text-decoration: underline; }
  .insp-list .via { color: var(--text-faint); font-size: 0.7rem; margin-top: 0.15rem; display: block; }
  .insp-list.external li { border-style: dashed; }
  .insp-list.external button { color: var(--external); cursor: default; }
  .insp-list.external button:hover { text-decoration: none; }
  .insp-uri {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.66rem;
    color: var(--text-faint);
    word-break: break-all;
    margin-top: 1.2rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--border-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="app" id="app">
  <header class="top">
    <div>
      <div class="wordmark"><span class="rock">&#9679;</span> DMML Browser</div>
      <div class="tagline">inspect the strata a commit log actually built</div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Choose a graph"></nav>
  </header>

  <div class="stats" id="stats"></div>

  <main class="split">
    <div class="canvas-wrap" id="canvasWrap">
      <svg id="svg" role="img" aria-label="Commit graph, laid out by citation generation">
        <g id="viewport"></g>
      </svg>
      <div class="legend">
        <h3>Reading this</h3>
        <div class="row"><span class="swatch" style="background:var(--surface-3);border:1px solid var(--border)"></span> generation band (0 = base fact)</div>
        <div class="row"><span class="line" style="background:var(--cite-strong)"></span> this node&rsquo;s outgoing citation</div>
        <div class="row"><span class="line" style="background:var(--accent-strong)"></span> a node citing this one</div>
        <div class="row"><span class="line" style="background:var(--external);border-bottom:2px dashed var(--external);height:0"></span> citation outside this graph</div>
      </div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="zoom-btn" id="zoomOut" title="Zoom out" aria-label="Zoom out">&minus;</button>
        <button class="zoom-btn" id="zoomReset" title="Reset view" aria-label="Reset view">&#8634;</button>
      </div>
    </div>
    <aside class="inspector" id="inspector">
      <div class="empty">Click any commit to inspect what it produced, what it cited, and what cites it back.</div>
    </aside>
  </main>
</div>

<script>
(function () {

    active: 0,
    selected: null,
    scale: 1,
    tx: 0,
    ty: 0,
  };

    var saved = localStorage.getItem("dmml-browser-active");

  var COL_W = 190;
  var NODE_W = 164;
  var NODE_H = 58;

  var wrap = document.getElementById("canvasWrap");

  function shortSubject(s) {
    var parts = s.split("/");
    var last = parts[parts.length - 1];
    // a bare numeric id ("sky/1", "audience/1") isn't a useful label on
    // its own -- keep the category too in that case ("sky/1", not "1").
    return /^\d+$/.test(last) ? s : last;

    return a.replace(/^did:plc:/, "");
  }
  function truncate(s, n) {
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }

  function layout(graph) {
    var byGen = {};
    graph.nodes.forEach(function (n) {
      (byGen[n.generation] = byGen[n.generation] || []).push(n);
    });
    var gens = Object.keys(byGen).map(Number).sort(function (a, b) { return a - b; });

    gens.forEach(function (g) {

      t3.textContent = shortAuthor(n.author);
      g.appendChild(t3);
      g.addEventListener("click", function () { selectNode(n.uri); });
      g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectNode(n.uri); } });
      viewport.appendChild(g);
    });

    renderInspector();
  }

  function findNode(uri) {
    return sources[state.active].graph.nodes.find(function (n) { return n.uri === uri; });
  }

  function selectNode(uri) {
    state.selected = state.selected === uri ? null : uri;
    render();
  }

  function renderInspector() {
    if (!state.selected) {
      inspector.innerHTML = '<div class="empty">Click any commit to inspect what it produced, what it cited, and what cites it back.</div>';
      return;
    }
    var graph = sources[state.active].graph;
    var n = findNode(state.selected);
    if (!n) { inspector.innerHTML = '<div class="empty">Not found.</div>'; return; }

    var outgoing = graph.edges.filter(function (e) { return e.from === n.uri; });
    var incoming = graph.edges.filter(function (e) { return e.to === n.uri; });

    var html = "";
    html += '<div class="insp-eyebrow">' + n.verb + " &middot; " + shortAuthor(n.author) + "</div>";
    html += '<div class="insp-subject">' + (n.produces[0] ? shortSubject(n.produces[0].subject) : "—") + "</div>";
    html += '<div class="insp-meta"><span class="gen-chip">generation ' + n.generation + '</span><span>' + n.produces.length + ' fact' + (n.produces.length === 1 ? '' : 's') + ' produced</span></div>';

    n.produces.forEach(function (p) {
      html += '<div class="insp-value"><span class="pred">' + p.subject + " &middot; " + p.predicate + '</span>' + escapeHtml(p.value) + '</div>';
    });

    html += '<div class="insp-section"><h4>Cites (' + outgoing.length + ')</h4>';
    if (outgoing.length) {
      html += '<ul class="insp-list">';
      outgoing.forEach(function (e) {
        if (e.to) {
          var target = findNode(e.to);
          html += '<li><button data-goto="' + e.to + '">' + (target ? shortSubject(target.produces[0] ? target.produces[0].subject : target.uri) : shortSubject(e.subject)) + '</button><span class="via">via ' + e.subject + ' · ' + e.predicate + '</span></li>';
        }
      });
      html += '</ul>';
      var externals = outgoing.filter(function (e) { return !e.to; });
      if (externals.length) {
        html += '<ul class="insp-list external">';
        externals.forEach(function (e) {
          html += '<li><button disabled>' + shortSubject(e.subject) + ' · ' + e.predicate + '</button><span class="via">outside this graph</span></li>';
        });
        html += '</ul>';
      }
    } else {
      html += '<div class="insp-value" style="font-style:italic;color:var(--text-faint)">Nothing — a base fact, generation 0.</div>';
    }
    html += '</div>';

    html += '<div class="insp-section"><h4>Cited by (' + incoming.length + ')</h4>';
    if (incoming.length) {
      html += '<ul class="insp-list">';
      incoming.forEach(function (e) {
        var source = findNode(e.from);
        html += '<li><button data-goto="' + e.from + '">' + (source ? shortSubject(source.produces[0] ? source.produces[0].subject : source.uri) : e.from) + '</button><span class="via">via ' + e.subject + ' · ' + e.predicate + '</span></li>';
      });
      html += '</ul>';
    } else {
      html += '<div class="insp-value" style="font-style:italic;color:var(--text-faint)">Nothing yet — no later commit in this graph builds on it.</div>';
    }
    html += '</div>';

    html += '<div class="insp-uri">' + n.uri + '<br/>cid: ' + n.cid + '</div>';

    inspector.innerHTML = html;
    inspector.querySelectorAll("[data-goto]").forEach(function (btn) {
      btn.addEventListener("click", function () { selectNode(btn.getAttribute("data-goto")); });
    });
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---- zoom / pan ----
  function resetView() { state.scale = 1; state.tx = 0; state.ty = 0; }
  function applyZoom(delta, cx, cy) {
    var next = Math.min(2.5, Math.max(0.35, state.scale * delta));
    var factor = next / state.scale;
    state.tx = cx - (cx - state.tx) * factor;
    state.ty = cy - (cy - state.ty) * factor;
    state.scale = next;
    viewport.setAttribute("transform", "translate(" + state.tx + "," + state.ty + ") scale(" + state.scale + ")");
  }

  wrap.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var rect = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var cx = ((ev.clientX - rect.left) / rect.width) * vb.width;
    var cy = ((ev.clientY - rect.top) / rect.height) * vb.height;
    applyZoom(ev.deltaY < 0 ? 1.12 : 0.89, cx, cy);
  }, { passive: false });

  // Pointer capture is deliberately NOT grabbed on plain pointerdown: on
  // an element with capture set, Chromium redirects the resulting click
  // to the capturing element too, not just pointer events -- confirmed
  // directly (a node click landed on #canvasWrap instead of the node
  // under the cursor). Capture is only taken once real movement crosses
  // a small threshold, so a plain click never engages it, and it is
  // always released on pointerup/leave/cancel.
  var dragging = false, panning = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
  var DRAG_THRESHOLD = 4;
  wrap.addEventListener("pointerdown", function (ev) {
    dragging = true; panning = false;
    lastX = downX = ev.clientX;
    lastY = downY = ev.clientY;
  });
  wrap.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (!panning) {
      if (Math.abs(ev.clientX - downX) < DRAG_THRESHOLD && Math.abs(ev.clientY - downY) < DRAG_THRESHOLD) return;
      panning = true;
      wrap.classList.add("grabbing");
      wrap.setPointerCapture(ev.pointerId);
    }
    var rect = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var scaleX = vb.width / rect.width, scaleY = vb.height / rect.height;
    state.tx += (ev.clientX - lastX) * scaleX;
    state.ty += (ev.clientY - lastY) * scaleY;
    lastX = ev.clientX; lastY = ev.clientY;
    viewport.setAttribute("transform", "translate(" + state.tx + "," + state.ty + ") scale(" + state.scale + ")");
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (evt) {
    wrap.addEventListener(evt, function (ev) {
      dragging = false; panning = false;
      wrap.classList.remove("grabbing");
      if (wrap.hasPointerCapture && wrap.hasPointerCapture(ev.pointerId)) wrap.releasePointerCapture(ev.pointerId);
    });
  });

  document.getElementById("zoomIn").addEventListener("click", function () {
    var vb = svg.viewBox.baseVal;
    applyZoom(1.2, vb.width / 2, vb.height / 2);
  });
  document.getElementById("zoomOut").addEventListener("click", function () {
    var vb = svg.viewBox.baseVal;
    applyZoom(0.83, vb.width / 2, vb.height / 2);
  });
  document.getElementById("zoomReset").addEventListener("click", function () {
    resetView();
    viewport.setAttribute("transform", "translate(0,0) scale(1)");
  });

  render();
})();
</script>
