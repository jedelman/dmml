[package]
name = "dmml-substrate-kit"
version.workspace = true
edition.workspace = true

[features]
# `iroh` is on by default so existing builds/callers are unaffected.
# For a local-only sanity build/test that skips iroh's heavy dependency
# graph (QUIC, relay discovery, netlink, its own crypto stacks -- the
# thing that exhausted this sandbox's disk mid-link), use:
#   cargo test -p dmml-substrate-kit --no-default-features --features sockets
default = ["iroh"]
iroh = [
    "dep:iroh",
    "dep:iroh-docs",
    "dep:iroh-blobs",
    "dep:iroh-gossip",
    "dep:n0-future",
    "dep:rustls",
]
sockets = []

[dependencies]
dmml = { path = "../dmml" }
dmml-runtime = { path = "../dmml-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ipld_dagcbor = "0.7"
cid = "0.11"
multihash = "0.19"
sha2 = "0.10"
oxigraph = { version = "0.5.9", default-features = false }
iroh = { version = "1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
iroh-docs = { version = "0.101", optional = true }
iroh-blobs = { version = "0.103", optional = true }
iroh-gossip = { version = "0.101", default-features = false, optional = true }
n0-future = { version = "0.3", optional = true }
anyhow = "1"
blake3 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-openai = { version = "0.41", features = ["chat-completion"] }
