name: dmml-hs CI

on:
  push:
    branches: [main]
    paths:
      - "dmml-hs/**"
      - ".github/workflows/dmml-hs-ci.yml"
  pull_request:
    paths:
      - "dmml-hs/**"
      - ".github/workflows/dmml-hs-ci.yml"
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dmml-hs
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.4.7"
          cabal-version: "3.8.1.0"

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-cabal-${{ hashFiles('dmml-hs/dmml-hs.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: cabal update
        run: cabal update

      - name: Build library and all executables
        run: cabal build all

      # Real, self-asserting demo binaries: each is a hardcoded scenario
      # that exits non-zero and prints "FAIL: ..." on any assertion
      # failure (see app/*Demo.hs), so a real regression fails this job,
      # not just a compile check. Not yet covered here: fire-demo,
      # sense-demo, retract-demo, retract-value-demo, complex-demo, and
      # the chained-retract/value-disambiguation demos under examples/ --
      # those are exercised via ad hoc fire-transition CLI invocations
      # with no committed script recording the exact args, so they are
      # not wired into CI. A real, disclosed gap, not silently skipped.
      - name: Run self-asserting demo suite
        run: |
          set -euo pipefail
          for demo in governance-demo guard-demo retro-chain-demo retro-gate-demo retroconsistency-demo; do
            echo "=== $demo ==="
            cabal run "$demo"
          done

      - name: Run cascade-demo (the one example with a committed run.sh)
        run: |
          FIRE_TRANSITION="$(cabal list-bin fire-transition)" \
            ./examples/cascade-demo/run.sh

      # check-citations (jedelman/dmml#6): real citation-integrity
      # checking. examples/citation-integrity-demo/ exercises the
      # "no local file, first-citation-wins" fallback path; the second
      # command re-derives the OTHER, stronger path (a citation against
      # a file actually present in the batch, checked against its real
      # recomputed identity) straight from a live fire-transition run,
      # then tampers with the cid and confirms it's caught -- see that
      # example's own README for why this isn't a separate fixture.
      - name: Run check-citations demo
        run: |
          set -euo pipefail
          cd examples/citation-integrity-demo
          cabal run check-citations -- a.dmml b.dmml
          if cabal run check-citations -- a.dmml b.dmml c.dmml; then
            echo "expected a citation mismatch (c.dmml vs b.dmml), got none" >&2
            exit 1
          fi
          cd ../chained-retract-demo
          FIRE="$(cabal list-bin fire-transition)"
          CHECK="$(cabal list-bin check-citations)"
          "$FIRE" keeper.dmml witnessEruption witnesses \
            --world world.dmml --param eruption=volcano/ashkar > /tmp/fired.dmml
          "$CHECK" world.dmml /tmp/fired.dmml
          sed 's/fnv1a64:[0-9a-f]*/fnv1a64:deadbeefdeadbeef/' /tmp/fired.dmml > /tmp/tampered.dmml
          if "$CHECK" world.dmml /tmp/tampered.dmml; then
            echo "expected a citation mismatch on tampered.dmml, got none" >&2
            exit 1
          fi
