name: dmml-hs CI

on:
  push:
    branches: [main]
    paths:
      - "dmml-hs/**"
      - ".github/workflows/dmml-hs-ci.yml"
  pull_request:
    paths:
      - "dmml-hs/**"
      - ".github/workflows/dmml-hs-ci.yml"
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dmml-hs
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.4.7"
          cabal-version: "3.8.1.0"

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-cabal-${{ hashFiles('dmml-hs/dmml-hs.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: cabal update
        run: cabal update

      - name: Build library and all executables
        run: cabal build all

      # Real, self-asserting demo binaries: each is a hardcoded scenario
      # that exits non-zero and prints "FAIL: ..." on any assertion
      # failure (see app/*Demo.hs), so a real regression fails this job,
      # not just a compile check. Not yet covered here: fire-demo,
      # sense-demo, retract-demo, retract-value-demo, complex-demo, and
      # the chained-retract/value-disambiguation demos under examples/ --
      # those are exercised via ad hoc fire-transition CLI invocations
      # with no committed script recording the exact args, so they are
      # not wired into CI. A real, disclosed gap, not silently skipped.
      - name: Run self-asserting demo suite
        run: |
          set -euo pipefail
          for demo in governance-demo guard-demo retro-chain-demo retro-gate-demo retroconsistency-demo; do
            echo "=== $demo ==="
            cabal run "$demo"
          done

      - name: Run cascade-demo (the one example with a committed run.sh)
        run: |
          FIRE_TRANSITION="$(cabal list-bin fire-transition)" \
            ./examples/cascade-demo/run.sh
